[project]
name = "paperlab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.5.0",
    "arq>=0.26",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-multipart>=0.0.18",
    "pyyaml>=6",
    "sentence-transformers>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# 4 workers halves the run; more is slower (they wait on the shared Postgres). `-n 0` runs serially, e.g. for pdb.
# loadgroup keeps each xdist_group on one worker (see conftest.py).
addopts = "-n 4 --dist loadgroup"

# Only applies when coverage runs (`uv run pytest --cov`), so single-file test runs aren't gated.
[tool.coverage.run]
source = ["app"]
# The default C tracer loses route lines after an SQLAlchemy greenlet switch; sys.monitoring doesn't.
core = "sysmon"

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

# torch must be a direct dependency: tool.uv.sources is ignored for transitive deps, and PyPI's
# Linux torch wheels pull ~43 CUDA packages (several GB) into the image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
