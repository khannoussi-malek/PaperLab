- id: second-passage-nsp
  kind: second_passage
  answer: BERT is pre-trained with a masked language model and a next sentence prediction task [C1][C2].
  passages:
    C1: *id004
    C2:
      paper: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
      page: 2
      section: 1 Introduction
      text: 'word based only on its context. Unlike left-toright language model pre-training, the MLM objective enables the
        representation to fuse the left and the right context, which allows us to pretrain a deep bidirectional Transformer.
        In addition to the masked language model, we also use a “next sentence prediction” task that jointly pretrains text-pair
        representations. The contributions of our paper are as follows:


        • We demonstrate the importance of bidirectional pre-training for language representations. Unlike Radford et al.
        (2018), which uses unidirectional language models for pre-training, BERT uses masked language models to enable pretrained
        deep bidirectional representations. This is also in contrast to Peters et al. (2018a), which uses a shallow concatenation
        of independently trained left-to-right and right-to-left LMs.


        • We show that pre-trained representations reduce the need for many heavily-engineered taskspecific architectures.
        BERT is the first finetuning based representation model that achieves state-of-the-art performance on a large suite
        of sentence-level and token-level tasks, outperforming many task-specific architectures.


        • BERT advances the state of the art for eleven NLP tasks. The code and pre-trained models are available at https://github.com/
        google-research/bert.'
  sentences:
  - role: supported
    accept: *id001
