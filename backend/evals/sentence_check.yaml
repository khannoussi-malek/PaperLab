# Answer-check gate (M34; run: python -m evals.sentence_check_eval). Each case is a planted chat answer with
# [C#] markers; its passages are verbatim chunk text from papers in the owner's library, so no retrieval runs.
# sentences: one entry per sentence of the answer, in order: role supported | unsupported | uncited, and the
# verdicts that count as right. Unsupported means contradicted, a number the passage lacks, or overstated.
gates:
  unsupported_flagged_runs: 3
  supported_ok_runs: 2
cases:
- id: true-big-model-days
  kind: 'true'
  answer: The big models were trained for 300,000 steps, which took 3.5 days [C1].
  passages:
    C1: &id002
      paper: Attention Is All You Need
      page: 7
      section: 5.2 Hardware and Schedule
      text: We trained our models on one machine with 8 NVIDIA P100 GPUs. For our base models using the hyperparameters described
        throughout the paper, each training step took about 0.4 seconds. We trained the base models for a total of 100,000
        steps or 12 hours. For our big models,(described on the bottom line of table 3), step time was 1.0 seconds. The big
        models were trained for 300,000 steps (3.5 days).
  sentences:
  - role: supported
    accept: &id001
    - supported
    - partially_supported
- id: true-glue-score
  kind: 'true'
  answer: On the official GLUE leaderboard, BERT-large scored 80.5, against 72.8 for OpenAI GPT [C1].
  passages:
    C1: &id004
      paper: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
      page: 6
      section: 4.1 GLUE
      text: Results are presented in Table 1. Both BERTBASE and BERTLARGE outperform all systems on all tasks by a substantial
        margin, obtaining 4.5% and 7.0% respective average accuracy improvement over the prior state of the art. Note that
        BERTBASE and OpenAI GPT are nearly identical in terms of model architecture apart from the attention masking. For
        the largest and most widely reported GLUE task, MNLI, BERT obtains a 4.6% absolute accuracy improvement. On the official
        GLUE leaderboard10, BERTLARGE obtains a score of 80.5, compared to OpenAI GPT, which obtains 72.8 as of the date of
        writing. We find that BERTLARGE significantly outperforms BERTBASE across all tasks, especially those with very little
        training data. The effect of model size is explored more thoroughly in Section 5.2.
  sentences:
  - role: supported
    accept: *id001
