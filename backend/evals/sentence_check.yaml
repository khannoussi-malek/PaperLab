- id: overstated-apixaban-age
  kind: overstated
  answer: Apixaban 2.5 mg twice daily is recommended for every patient with atrial fibrillation aged 80 or over [C1].
  passages:
    C1: &id005
      paper: Eliquis, INN-apixaban
      page: 3
      section: null
      text: 'In patients undergoing knee replacement surgery The recommended duration of treatment is 10 to 14 days. Prevention
        of stroke and systemic embolism in adult patients with non-valvular atrial fibrillation (NVAF) The recommended dose
        of apixaban is 5 mg taken orally twice daily. Dose reduction The recommended dose of apixaban is 2.5 mg taken orally
        twice daily in patients with NVAF and at least two of the following characteristics: age ≥ 80 years, body weight ≤
        60 kg, or serum creatinine ≥ 1.5 mg/dL (133 micromole/L). Therapy should be continued long-term. Treatment of DVT,
        treatment of PE and prevention of recurrent DVT and PE (VTEt) in adults The recommended dose of apixaban for the treatment
        of acute DVT and treatment of PE is 10 mg taken orally twice daily for the first 7 days followed by 5 mg taken orally
        twice daily. As per available medical guidelines, short duration of treatment (at least 3 months) should be based
        on transient risk factors (e.g., recent surgery, trauma, immobilisation). The recommended dose of apixaban for the
        prevention of recurrent DVT and PE is 2.5 mg taken orally twice daily. When prevention of recurrent DVT and PE is
        indicated, the 2.5 mg twice daily dose should be initiated following completion of 6 months of treatment with apixaban
        5 mg twice daily or with another anticoagulant, as indicated in Table 1 below (see also section 5.1). Table 1: Dose
        recommendation (VTEt)'
  sentences:
  - role: unsupported
