  kind: contradicted
  answer: The models were trained on a single NVIDIA P100 GPU [C1].
  passages:
    C1: *id002
  sentences:
  - role: unsupported
    accept: &id003
    - partially_supported
    - not_supported
    - not_addressed
- id: contradicted-base-steps
  kind: contradicted
  answer: The base models were trained for 300,000 steps [C1].
  passages:
    C1: *id002
  sentences:
  - role: unsupported
