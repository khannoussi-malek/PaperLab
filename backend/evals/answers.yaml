      - {page: 8, quote: "10.04 vs. 13.56 per KLOC", body: "Surprising: fewer CodeQL alerts in AI code. Selection bias from self-admitted comments?"}
      - {page: 10, quote: "AI assistance reshapes development effort rather than simply reducing it", body: "AI-involved commits are smaller but need more follow-up changes over 90 days.", provenance: llm}
  - paper: Rethinking the Value
    notes:
      - {page: 2, quote: "74.4% resolution) generates at least one new test artifact in about 83% of tasks", body: "Claude writes tests a lot and GPT-5.2 almost never, yet their results are close."}
      - {page: 4, quote: "the total LLM API cost is approximately USD 1,600", body: "Cheap enough that we could replicate it with our own agent."}
