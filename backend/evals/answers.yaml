# Answer eval cases. Run: python -m evals.answers (see answers.py).
# paper: a case-insensitive title prefix that must match exactly one paper.
# points: an answer hits a point when it says any of its phrasings as whole words (case, spacing and thousands
#   separators ignored); it's correct when it hits `need` points, or all of them when `need` is omitted.
# evidence: a passage the answer cites must be on that page and hold that phrase (checked before any question).
#   On a summary it checks that citations land on a passage behind a key point, not on a wrong label.
# kind: fact | overview | followup (`before` is the question it follows) | notes (`note` is saved, then rolled back)
#   | refusal (the paper doesn't answer it: correct when the answer says so; `points` default to answers.REFUSALS)
#   | write_notes (the reader asks for notes: scored on the :::note blocks, see answers.blocks_right).
# scope: workspace asks a case only in the workspace config (a question about several papers); paper is then only
#   its order.
# paper_notes: a reader's notes, saved on their paper before every question when run with --with-paper-notes.
# Attention and BERT predate the model, so the `none` config shows which of their answers it already knows.
cases:
