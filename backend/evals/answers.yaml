# A reader's notes as a real library holds them: remarks, questions to self, and a note saved from an AI answer.
paper_notes:
  - paper: Attention Is All You Need
    notes:
      - {page: 3, quote: "composed of a stack of N = 6 identical layers", body: "Encoder and decoder stacks: compare with BERT, which keeps only the encoder."}
      - {page: 8, quote: "new state-of-the-art BLEU score of 28.4", body: "Check whether later papers beat this on WMT14."}
      - {page: 10, quote: "the first sequence transduction model based entirely on attention", body: "The Transformer replaces recurrence with self-attention and trains faster.", provenance: llm}
  - paper: "BERT: Pre-training"
    notes:
      - {page: 4, quote: "mask some percentage of the input tokens at random", body: "Masking works like a cloze test; our dataset might need a different ratio."}
      - {page: 6, quote: "4.5% and 7.0% respective average accuracy improvement", body: "Big gains, but GLUE only. Nothing on low-resource languages."}
      - {page: 1, quote: "Bidirectional Encoder Representations from Transformers", body: "BERT pre-trains deep bidirectional representations and is fine-tuned per task.", provenance: llm}
  - paper: How Coding Agents Fail
    notes:
      - {page: 5, quote: "Developer Constraint Violation (S3, 38.33%)", body: "Matches what we see: our agents ignore 'don't run migrations'."}
      - {page: 3, quote: "use GPT-5.4 with temperature 0", body: "They rely on an LLM judge. Check its accuracy before citing numbers."}
      - {page: 9, quote: "We present the first large-scale analysis of", body: "Most misalignment costs developer effort and trust rather than breaking the system.", provenance: llm}
  - paper: A Large-Scale Comprehensive Measurement
    notes:
