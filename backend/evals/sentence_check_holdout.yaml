cases:
- id: h-true-select-rates
  kind: 'true'
  answer: A primary cardiovascular event occurred in 6.5% of patients on semaglutide and 8.0% on placebo [C1].
  passages:
    C1: &id001
      paper: Semaglutide and Cardiovascular Outcomes in Obesity without Diabetes
      page: 1
      section: null
      text: 'RESULTS A total of 17,604 patients were enrolled; 8803 were assigned to receive semaglutide and 8801 to receive
        placebo. The mean (±SD) duration of exposure to semaglutide or placebo was 34.2±13.7 months, and the mean duration
        of follow-up was 39.8±9.4 months. A primary cardiovascular end-point event occurred in 569 of the 8803 patients (6.5%)
        in the semaglutide group and in 701 of the 8801 patients (8.0%) in the placebo group (hazard ratio, 0.80; 95% confidence
        interval, 0.72 to 0.90; P<0.001). Adverse events leading to permanent discontinuation of the trial product occurred
        in 1461 patients (16.6%) in the semaglutide group and 718 patients (8.2%) in the placebo group (P<0.001).


        CONCLUSIONS In patients with preexisting cardiovascular disease and overweight or obesity but without diabetes, weekly
        subcutaneous semaglutide at a dose of 2.4 mg was superior to placebo in reducing the incidence of death from cardiovascular
        causes, nonfatal myocardial infarction, or nonfatal stroke at a mean follow-up of 39.8 months. (Funded by Novo Nordisk;
        SELECT ClinicalTrials.gov number, NCT03574597.)'
  sentences:
  - role: supported
    accept: &id004
    - supported
    - partially_supported
