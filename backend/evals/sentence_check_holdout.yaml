- id: h-overstated-masking
  kind: overstated
  answer: During pre-training BERT masks every WordPiece token in each sequence [C1].
  passages:
    C1: &id003
      paper: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
      page: 4
      section: 3.1 Pre-training BERT
      text: 'In order to train a deep bidirectional representation, we simply mask some percentage of the input tokens at
        random, and then predict those masked tokens. We refer to this procedure as a “masked LM” (MLM), although it is often
        referred to as a Cloze task in the literature (Taylor, 1953). In this case, the final hidden vectors corresponding
        to the mask tokens are fed into an output softmax over the vocabulary, as in a standard LM. In all of our experiments,
        we mask 15% of all WordPiece tokens in each sequence at random. In contrast to denoising auto-encoders (Vincent et
        al., 2008), we only predict the masked words rather than reconstructing the entire input.


        Although this allows us to obtain a bidirectional pre-trained model, a downside is that we are creating a mismatch
        between pre-training and fine-tuning, since the [MASK] token does not appear during fine-tuning. To mitigate this,
        we do not always replace “masked” words with the actual [MASK] token. The training data generator chooses 15% of the
        token positions at random for prediction. If the i-th token is chosen, we replace the i-th token with (1) the [MASK]
        token 80% of the time (2) a random token 10% of the time (3) the unchanged i-th token 10% of the time. Then, Ti will
        be used to predict the original token with cross entropy loss. We compare variations of this procedure in Appendix
        C.2.'
  sentences:
  - role: unsupported
    accept: *id002
- id: h-true-masking
  kind: 'true'
  answer: BERT masks 15% of the WordPiece tokens in each sequence at random [C1].
  passages:
    C1: *id003
  sentences:
