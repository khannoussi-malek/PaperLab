# Releases PaperLab. A pushed v* tag builds the image for amd64 and arm64, the five installers and the two-command
# install into a draft GitHub Release, which the owner publishes. A pull request that changes these release files, or
# a manual run, is a dry run: it builds everything and publishes nothing. Tests run locally, not here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/**
      - Dockerfile
      - .dockerignore

permissions:
  contents: read

env:
  IMAGE: ghcr.io/khannoussi-malek/paperlab
  # Only a pushed tag publishes.
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag is desktop/package.json's version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, desktop/package.json's version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (dry run)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:dry-run
          load: true
      - name: Size (dry run)
        if: env.PUBLISH != 'true'
        run: docker image ls "$IMAGE"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the manifest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name == 'push'
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both architectures with the version, never latest
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t "$IMAGE:${{ needs.check.outputs.version }}" $(printf "$IMAGE@sha256:%s " *)

  installers:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      # Targets, architectures and ad-hoc signing are in package.json's build key. The release job publishes.
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    needs: [check, image, manifest, installers]
    # manifest is skipped in a dry run; this job still builds the tarball then, and publishes only on a tag.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: out
      - name: The two-command install
        run: |
          mkdir -p paperlab/scripts
          sed "s/PAPERLAB_VERSION:-dev}/PAPERLAB_VERSION:-$VERSION}/" desktop/docker-compose.yml > paperlab/docker-compose.yml
          grep -q "paperlab:\${PAPERLAB_VERSION:-$VERSION}" paperlab/docker-compose.yml
          cp -p scripts/paperlab-mcp paperlab/scripts/paperlab-mcp
          tar czf "out/paperlab-$VERSION.tar.gz" paperlab
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: paperlab-${{ needs.check.outputs.version }}.tar.gz
          path: out/paperlab-*.tar.gz
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "PaperLab $VERSION" \
            --notes "Installers for macOS, Windows and Linux, and paperlab-$VERSION.tar.gz for the two-command install: see the README's Quick start." \
            out/*
